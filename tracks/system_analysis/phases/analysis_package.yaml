config_version: 1
phase:
  id: analysis_package
  name: Analysis Package
  description: Apply evidence-supported review corrections and produce the final human-readable system analysis.
  skills: []
  prompt:
    active: 1
    path: templates/prompts/system_analysis/analysis_package/prompt_v<active>.md
  outputs:
    create_directories:
      - analysis
    create_artifacts:
      - analysis/system-analysis.md
      - analysis/repository-topology.md
      - analysis/repositories.yaml
      - analysis/open-questions.md
    prompts:
      - analysis_package
  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - analysis/system-analysis.md
      - analysis/repository-topology.md
      - analysis/repositories.yaml
      - analysis/open-questions.md
