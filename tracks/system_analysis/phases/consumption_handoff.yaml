config_version: 1

phase:
  id: consumption_handoff
  name: Consumption Handoff
  description: Re-read the publication and emit a self-contained downstream contract.
  skills: []
  prompt:
    active: 1
    path: templates/prompts/system_analysis/consumption_handoff/prompt_v<active>.md
  outputs:
    create_directories:
      - consumption
    create_artifacts:
      - consumption/consumption_receipt.json
      - consumption/downstream_manifest.yaml
      - consumption/handoff.md
      - consumption/validation_report.md
    prompts:
      - consumption_handoff
  read_sources:
    - "{{CARD_DIR}}"
    - "{{EAW_WORKDIR}}/config/repos.conf"
    - "{{RUNTIME_ROOT}}/tracks/system_analysis"
  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: consumption/consumption_receipt.json
        validation_mode: blocking
      - path: consumption/downstream_manifest.yaml
        validation_mode: blocking
      - path: consumption/handoff.md
        validation_mode: blocking
      - path: consumption/validation_report.md
        validation_mode: blocking
