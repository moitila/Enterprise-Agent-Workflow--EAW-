config_version: 1
capabilities:
  - knowledge.read
  - execution.local_sandbox
  - execution.readonly_environment
  - execution.escalated

agent_contract:
  sandbox_teardown: |
    Quando esta fase declara execution.local_sandbox:
    1. Criar sandbox em $TMPDIR/EAW-[CARD_ID]/ antes de qualquer escrita efemera.
    2. Declarar trap 'rm -rf "$SANDBOX_PATH"' EXIT imediatamente apos criar o sandbox.
    3. Verificar ausencia do sandbox ao final normal da fase:
       test -d "$SANDBOX_PATH" && echo RESIDUAL_FAIL || echo TEARDOWN_OK
    4. Risco residual: SIGKILL impede o trap; artefatos efemeros persistem ate proxima sessao
       (impacto BAIXO - sem dado sensivel).

phase:
  id: findings
  name: Findings
  description: Analyze the intake information and identify key findings.

  skills:
    - eaw_spike_operator

  prompt:
    active: 2
    path: templates/prompts/spike/findings/prompt_v<active>.md

  outputs:
    create_directories: []
    create_artifacts:
      - investigations/20_findings.md
      # 20_handoff.json is a live state artifact updated in-place by successive phases
      # (intake writes first, findings updates). Declaring it here aligns the formal
      # contract with the behaviour already described in findings/prompt_v1.md.
      - investigations/20_handoff.json

  tooling_hints:
    - "execution.readonly_environment: acesso investigativo ao banco Oracle apenas para leitura (EXPLAIN PLAN, dicionário). A credencial é read-only por configuração de ambiente; INSERT/UPDATE falha com erro de privilégio Oracle, não erro de EAW."
    - "execution.escalated: quando a fase não pode executar uma operação de forma autônoma, produzir investigations/XX_escalation_request.md com campos obrigatórios: operation, preconditions, risks, expected_result, requested_by, result_injection_path. Emitir handoff waiting com blocker: escalation_pending: <operacao>. O orquestrador executa e injeta o resultado antes da retomada."

  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: investigations/20_findings.md
        min_bytes: 500
        validation_mode: blocking
