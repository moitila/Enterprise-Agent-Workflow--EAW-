config_version: 1

phase:
  id: consistency_validation
  name: Consistency Validation
  description: Validate mechanical and semantic consistency of the analytical package.

  skills: []

  prompt:
    active: 1
    path: templates/prompts/business_rules_analysis/consistency_validation/prompt_v<active>.md

  outputs:
    create_directories:
      - analysis
      - investigations
    create_artifacts:
      - analysis/30_validation_report.md
      - analysis/31_validation_results.json
      - investigations/20_handoff.json
    prompts:
      - consistency_validation

  read_sources:
    - "{{CARD_DIR}}"
    - "{{CONFIG_SOURCE}}"
    - "{{RUNTIME_ROOT}}/tracks/business_rules_analysis"

  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: analysis/30_validation_report.md
        validation_mode: blocking
      - path: analysis/31_validation_results.json
        validation_mode: blocking
      - path: investigations/20_handoff.json
        validation_mode: blocking
