config_version: 1

phase:
  id: approval_gate
  name: Approval Gate
  description: Request and validate external approval bound to the exact candidate digest.

  skills: []

  prompt:
    active: 1
    path: templates/prompts/business_rules_analysis/approval_gate/prompt_v<active>.md

  outputs:
    create_directories:
      - approval
      - investigations
    create_artifacts:
      - approval/approval_request.json
      - approval/approval_validation.json
      - investigations/20_handoff.json
    prompts:
      - approval_gate

  read_sources:
    - "{{CARD_DIR}}"
    - "{{CONFIG_SOURCE}}"
    - "{{RUNTIME_ROOT}}/tracks/business_rules_analysis"

  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: approval/approval_request.json
        validation_mode: blocking
      - path: approval/approval_validation.json
        validation_mode: blocking
      - path: investigations/20_handoff.json
        validation_mode: blocking
