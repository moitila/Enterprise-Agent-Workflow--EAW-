config_version: 1

phase:
  id: rule_model
  name: Rule Model
  description: Extract and classify traceable business rules while preserving upstream status.

  skills: []

  prompt:
    active: 1
    path: templates/prompts/business_rules_analysis/rule_model/prompt_v<active>.md

  outputs:
    create_directories:
      - analysis
      - investigations
    create_artifacts:
      - analysis/10_business_rules.md
      - analysis/11_business_rules.yaml
      - analysis/12_rule_questions.md
      - investigations/20_handoff.json
    prompts:
      - rule_model

  read_sources:
    - "{{CARD_DIR}}"
    - "{{CONFIG_SOURCE}}"
    - "{{RUNTIME_ROOT}}/tracks/business_rules_analysis"

  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: analysis/10_business_rules.md
        validation_mode: blocking
      - path: analysis/11_business_rules.yaml
        validation_mode: blocking
      - path: analysis/12_rule_questions.md
        validation_mode: blocking
      - path: investigations/20_handoff.json
        validation_mode: blocking
