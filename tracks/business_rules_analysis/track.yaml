config_version: 1

track:
  id: business_rules_analysis
  name: Business Rules Analysis
  description: Analyze traceable business rules from declared upstream analyses.
  initial_phase: source_inventory
  final_phase: analysis_package
  initial_outputs:
    create_directories:
      - ingest
      - investigations
      - analysis
  phases:
    - source_inventory
    - rule_model
    - rule_relationships
    - critical_review
    - analysis_package
  transitions:
    source_inventory:
      next: rule_model
      contract: {emit_handoff: true, consume_previous: true}
    rule_model:
      next: rule_relationships
      contract: {emit_handoff: true, consume_previous: true}
    rule_relationships:
      next: critical_review
      contract: {emit_handoff: true, consume_previous: true}
    critical_review:
      next: analysis_package
      contract: {emit_handoff: true, consume_previous: true}
  rules:
    one_prompt_per_phase: true
    generated_artifacts_of_each_phase_must_be_non_empty: true
    authority_must_be_explicit: true
    upstream_status_must_be_preserved: true
