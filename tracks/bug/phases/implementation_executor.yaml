config_version: 1

phase:
  id: implementation_executor
  skills:
    - eaw_implementation_quality
  name: Implementation Executor
  description: Execute the planned implementation tasks.

  prompt:
    active: 2
    path: templates/prompts/bug/implementation_executor/prompt_v<active>.md

  outputs:
    create_directories: []
    create_artifacts:
      - implementation/20_patch_notes.md

  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: implementation/20_patch_notes.md
        validation_mode: blocking
