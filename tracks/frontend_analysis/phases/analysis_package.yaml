config_version: 1

phase:
  id: analysis_package
  name: Analysis Package
  description: Consolidate reviewed frontend analysis into coherent human-readable and structured final artifacts while preserving unresolved divergence.
  skills: []
  prompt:
    active: 1
    path: templates/prompts/frontend_analysis/analysis_package/prompt_v<active>.md
  tooling_hints: []
  outputs:
    create_directories:
      - analysis
    create_artifacts:
      - analysis/frontend-analysis.md
      - analysis/frontend-journeys.yaml
      - analysis/frontend-interactions.yaml
      - analysis/frontend-architecture.yaml
      - analysis/frontend-decisions.yaml
      - analysis/open-questions.md
    prompts:
      - analysis_package
  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - analysis/frontend-analysis.md
      - analysis/frontend-journeys.yaml
      - analysis/frontend-interactions.yaml
      - analysis/frontend-architecture.yaml
      - analysis/frontend-decisions.yaml
      - analysis/open-questions.md
