config_version: 1

phase:
  id: track_design
  name: Track Design
  description: Design the track structure, phases, transitions, and handoff contracts.

  skills:
    - eaw_track_creator

  prompt:
    active: 1
    path: templates/prompts/track_creator/track_design/prompt_v<active>.md

  outputs:
    create_directories:
      - investigations
    create_artifacts:
      - investigations/10_track_design.md
    prompts:
      - track_design

  read_sources:
    - "{{RUNTIME_ROOT}}/docs/WORKFLOW_YAML_CONTRACT.md"
    - "{{RUNTIME_ROOT}}/docs/PROMPT_GOVERNANCE.md"
    - "{{RUNTIME_ROOT}}/skills/registry.yaml"
    - "{{RUNTIME_ROOT}}/tracks"
    - "{{RUNTIME_ROOT}}/templates/prompts"
    - "{{CARD_DIR}}/investigations"

  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: investigations/10_track_design.md
        validation_mode: blocking
