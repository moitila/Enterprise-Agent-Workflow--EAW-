config_version: 1

phase:
  id: implementation_planning
  name: Implementation Planning
  description: Convert the approved track design into scope.lock and change_plan.

  skills:
    - eaw_track_creator
    - eaw_prompt_creator

  prompt:
    active: 1
    path: templates/prompts/track_creator/implementation_planning/prompt_v<active>.md

  outputs:
    create_directories:
      - implementation
      - prompts
    create_artifacts:
      - implementation/00_scope.lock.md
      - implementation/10_change_plan.md
    prompts:
      - implementation_planning

  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: implementation/00_scope.lock.md
        validation_mode: blocking
        required_sections:
          - "## Base Obrigatoria"
          - "## Hipotese(s) Base"
          - "## Contexto"
          - "## In Scope"
          - "## Out of Scope"
          - "## Allowlist de Escrita"
          - "## Regra de Escrita"
      - path: implementation/10_change_plan.md
        validation_mode: blocking
        required_sections:
          - "## Objetivo de Execucao"
          - "## Hipotese(s) Selecionada(s)"
          - "## Assuncoes Explicitas"
          - "## Steps"
          - "## Validacao Tecnica Obrigatoria"
          - "## Rollback"
