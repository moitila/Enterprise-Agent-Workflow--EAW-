config_version: 1

phase:
  id: implementation_executor
  name: Implementation Executor
  description: Create all track artifacts per the change_plan and register the track.

  skills:
    - eaw_track_creator
    - eaw_prompt_creator

  prompt:
    active: 3
    path: templates/prompts/track_creator/implementation_executor/prompt_v<active>.md

  outputs:
    create_directories: []
    create_artifacts:
      - implementation/20_patch_notes.md
    prompts:
      - implementation_executor

  read_sources:
    - "{{RUNTIME_ROOT}}/tracks/track_creator"
    - "{{CARD_DIR}}/implementation"
    - "{{CARD_DIR}}/investigations/00_intake.md"
    - "{{CARD_DIR}}/investigations/10_track_design.md"
    - "{{CARD_DIR}}/investigations/20_prompt_design.md"
    - "{{RUNTIME_ROOT}}/docs/WORKFLOW_YAML_CONTRACT.md"
    - "{{RUNTIME_ROOT}}/scripts/commands/eaw_commands.sh"
    - "{{RUNTIME_ROOT}}/scripts/lib/analysis_delivery_contract.sh"
    - "{{RUNTIME_ROOT}}/tracks/verification_validation_analysis/phases/source_inventory.yaml"
    - "{{RUNTIME_ROOT}}/tracks/verification_validation_analysis/phases/analysis_package.yaml"

  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: implementation/20_patch_notes.md
        validation_mode: blocking
