config_version: 1

phase:
  id: intake
  name: Intake
  description: Collect the track goal, problem, expected result, and constraints from the user.

  skills: []

  prompt:
    active: 1
    path: templates/prompts/track_creator/intake/prompt_v<active>.md

  outputs:
    create_directories:
      - ingest
      - investigations
    create_artifacts:
      - investigations/00_intake.md
    prompts:
      - intake

  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: investigations/00_intake.md
        validation_mode: blocking
        required_headings:
          - "## Objetivo da Track"
          - "## Problema"
          - "## Resultado Esperado"
          - "## Restricoes Operacionais"
          - "## Questoes em Aberto"
