config_version: 1

phase:
  id: source_inventory
  name: Source Inventory
  description: Inventory materialized API-analysis sources, provenance, authority, coverage, conflicts, and limitations without synthesizing contract operations.
  skills: []
  prompt:
    active: 1
    path: templates/prompts/api_contract_analysis/source_inventory/prompt_v<active>.md
  tooling_hints: []
  outputs:
    create_directories:
      - analysis
      - investigations
    create_artifacts:
      - analysis/00_source_manifest.yaml
      - analysis/01_source_gaps.md
      - investigations/20_handoff.json
    prompts:
      - source_inventory
  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - analysis/00_source_manifest.yaml
      - analysis/01_source_gaps.md
      - investigations/20_handoff.json
