config_version: 1

phase:
  id: critical_review
  name: Critical Review
  description: Independently challenge completeness, consistency, traceability, boundaries, semantics, and consumer risks without creating an approval gate.
  skills: []
  prompt:
    active: 1
    path: templates/prompts/api_contract_analysis/critical_review/prompt_v<active>.md
  tooling_hints: []
  outputs:
    create_directories:
      - analysis
      - investigations
    create_artifacts:
      - analysis/40_critical_review.md
      - investigations/20_handoff.json
    prompts:
      - critical_review
  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - analysis/40_critical_review.md
      - investigations/20_handoff.json
