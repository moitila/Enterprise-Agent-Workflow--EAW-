config_version: 1

phase:
  id: analysis_package
  name: Analysis Package
  description: Consolidate the reviewed API contract analysis into consistent human-readable and structured artifacts with explicit finding dispositions.
  skills: []
  prompt:
    active: 1
    path: templates/prompts/api_contract_analysis/analysis_package/prompt_v<active>.md
  tooling_hints: []
  outputs:
    create_directories:
      - analysis
    create_artifacts:
      - analysis/api-contract.md
      - analysis/api-contract.yaml
      - analysis/api-decisions.yaml
      - analysis/open-questions.md
    prompts:
      - analysis_package
  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - analysis/api-contract.md
      - analysis/api-contract.yaml
      - analysis/api-decisions.yaml
      - analysis/open-questions.md
