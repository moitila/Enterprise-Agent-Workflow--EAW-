      - contract_baseline
  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - analysis/10_contract_baseline.candidate.md
      - analysis/11_capability_contract_map.yaml
      - analysis/12_contract_questions.md
      - investigations/20_handoff.json
