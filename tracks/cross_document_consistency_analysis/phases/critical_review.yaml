config_version: 1
phase:
  id: critical_review
  name: Critical Review
  description: Independent reviewer challenging evidence quality, scope, comparison, authority, impact, dispositions, provenance, and cross-artifact consistency.
  skills: []
  prompt:
    active: 1
    path: templates/prompts/cross_document_consistency_analysis/critical_review/prompt_v1.md
  tooling_hints: []
  outputs:
    create_directories:
      - analysis
      - investigations
    create_artifacts:
      - analysis/65_critical_review.md
      - analysis/66_review_observations.yaml
      - investigations/20_handoff.json
    prompts:
      - critical_review
  read_sources:
    - '{{CONFIG_SOURCE}}'
    - '{{CARD_DIR}}/analysis/00_ingest_manifest.yaml'
    - '{{CARD_DIR}}/investigations/00_intake.md'
    - '{{CARD_DIR}}/analysis/10_source_manifest.yaml'
    - '{{CARD_DIR}}/analysis/11_source_provenance.md'
    - '{{CARD_DIR}}/analysis/12_source_gaps.md'
    - '{{CARD_DIR}}/analysis/20_document_model.yaml'
    - '{{CARD_DIR}}/analysis/21_claim_register.yaml'
    - '{{CARD_DIR}}/analysis/30_consistency_matrix.yaml'
    - '{{CARD_DIR}}/analysis/31_consistency_observations.md'
    - '{{CARD_DIR}}/analysis/40_conflict_register.yaml'
    - '{{CARD_DIR}}/analysis/41_authority_assessment.md'
    - '{{CARD_DIR}}/analysis/50_impact_map.yaml'
    - '{{CARD_DIR}}/analysis/51_downstream_impact.md'
    - '{{CARD_DIR}}/analysis/60_disposition_register.yaml'
    - '{{CARD_DIR}}/analysis/61_recommendations.md'
    - '{{CARD_DIR}}/investigations/20_handoff.json'
  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: analysis/65_critical_review.md
        validation_mode: blocking
      - path: analysis/66_review_observations.yaml
        validation_mode: blocking
      - path: investigations/20_handoff.json
        validation_mode: blocking
  read_sources_from: required_inventory_sources
  evidence_manifest: analysis/10_source_manifest.yaml
