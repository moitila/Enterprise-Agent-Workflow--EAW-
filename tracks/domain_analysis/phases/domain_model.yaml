config_version: 1

phase:
  id: domain_model
  name: Domain Model
  description: Extract evidence-linked language, actors, concepts, relations and boundaries.
  skills: []
  prompt:
    active: 3
    path: templates/prompts/domain_analysis/domain_model/prompt_v<active>.md
  outputs:
    create_directories:
      - analysis
      - investigations
    create_artifacts:
      - analysis/10_domain_model.md
      - analysis/11_domain_glossary.yaml
      - analysis/12_domain_questions.md
      - investigations/20_handoff.json
    prompts:
      - domain_model
  read_sources:
    - "{{CARD_DIR}}"
    - "{{EAW_WORKDIR}}/config/repos.conf"
    - "{{RUNTIME_ROOT}}/tracks/domain_analysis"
  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: analysis/10_domain_model.md
        validation_mode: blocking
      - path: analysis/11_domain_glossary.yaml
        validation_mode: blocking
      - path: analysis/12_domain_questions.md
        validation_mode: blocking
      - path: investigations/20_handoff.json
        validation_mode: blocking
