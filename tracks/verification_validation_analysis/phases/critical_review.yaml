config_version: 1

phase:
  id: critical_review
  name: Critical Review
  description: Critical Review for source-grounded V&V analysis.
  skills: []
  prompt:
    active: 1
    path: templates/prompts/verification_validation_analysis/critical_review/prompt_v<active>.md
  outputs:
    create_directories:
      - analysis
      - investigations
    create_artifacts:
      - analysis/60_critical_review.md
      - analysis/61_review_findings.yaml
      - investigations/20_handoff.json
    prompts:
      - critical_review
  read_sources:
    - "{{CARD_DIR}}"
    - "{{CONFIG_SOURCE}}"
  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: analysis/60_critical_review.md
        validation_mode: blocking
      - path: analysis/61_review_findings.yaml
        validation_mode: blocking
      - path: investigations/20_handoff.json
        validation_mode: blocking
