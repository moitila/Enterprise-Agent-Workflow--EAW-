config_version: 1

phase:
  id: ingest
  name: Ingest
  description: Ingest for source-grounded V&V analysis.
  skills: []
  prompt:
    active: 1
    path: templates/prompts/verification_validation_analysis/ingest/prompt_v<active>.md
  outputs:
    create_directories:
      - investigations
    create_artifacts:
      - investigations/01_ingest_manifest.yaml
      - investigations/20_handoff.json
    prompts:
      - ingest
  read_sources:
    - "{{CARD_DIR}}"
    - "{{CONFIG_SOURCE}}"
  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: investigations/01_ingest_manifest.yaml
        validation_mode: blocking
      - path: investigations/20_handoff.json
        validation_mode: blocking
