config_version: 1

phase:
  id: analysis_package
  name: Analysis Package
  description: Analysis Package for source-grounded V&V analysis.
  skills: []
  prompt:
    active: 1
    path: templates/prompts/verification_validation_analysis/analysis_package/prompt_v<active>.md
  outputs:
    create_directories:
      - analysis
    create_artifacts:
      - analysis/70_package_handoff.md
    prompts:
      - analysis_package
  read_sources:
    - "{{CARD_DIR}}"
    - "{{CONFIG_SOURCE}}"
  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: analysis/70_package_handoff.md
        validation_mode: blocking
