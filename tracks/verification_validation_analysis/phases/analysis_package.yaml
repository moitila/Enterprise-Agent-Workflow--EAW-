config_version: 1

phase:
  id: analysis_package
  name: Analysis Package
  description: Analysis Package for source-grounded V&V analysis.
  skills: []
  prompt:
    active: 1
    path: templates/prompts/verification_validation_analysis/analysis_package/prompt_v<active>.md
  outputs:
    create_directories:
      - analysis
    create_artifacts:
      - analysis/verification-validation-analysis.md
      - analysis/verification-validation-matrix.yaml
      - analysis/verification-validation-decisions.yaml
      - analysis/70_package_handoff.md
    prompts:
      - analysis_package
  read_sources:
    - "{{CARD_DIR}}"
    - "{{CONFIG_SOURCE}}"
  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: analysis/verification-validation-analysis.md
        validation_mode: blocking
      - path: analysis/verification-validation-matrix.yaml
        validation_mode: blocking
      - path: analysis/verification-validation-decisions.yaml
        validation_mode: blocking
      - path: analysis/70_package_handoff.md
        validation_mode: blocking
  delivery_contract: required
  package_artifact: analysis/70_package_handoff.md
  target_delivery_paths:
    - docs/verification-validation-analysis.md
    - docs/verification-validation-matrix.yaml
    - docs/verification-validation-decisions.yaml
