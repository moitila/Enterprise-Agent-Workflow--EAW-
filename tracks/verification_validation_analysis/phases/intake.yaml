config_version: 1

phase:
  id: intake
  name: Intake
  description: Intake for source-grounded V&V analysis.
  skills: []
  prompt:
    active: 1
    path: templates/prompts/verification_validation_analysis/intake/prompt_v<active>.md
  outputs:
    create_directories:
      - investigations
    create_artifacts:
      - investigations/00_intake.md
      - investigations/20_handoff.json
    prompts:
      - intake
  read_sources:
    - "{{CARD_DIR}}"
    - "{{CONFIG_SOURCE}}"
  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: investigations/00_intake.md
        validation_mode: blocking
      - path: investigations/20_handoff.json
        validation_mode: blocking
