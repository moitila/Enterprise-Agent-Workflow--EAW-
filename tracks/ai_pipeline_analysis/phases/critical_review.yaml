config_version: 1

phase:
  id: critical_review
  name: Critical Review
  description: Independently challenge the proposed analysis and record traceable findings and required treatment.
  skills: []
  prompt:
    active: 1
    path: templates/prompts/ai_pipeline_analysis/critical_review/prompt_v<active>.md
  outputs:
    create_directories:
      - analysis
      - investigations
    create_artifacts:
      - analysis/50_critical_review.md
      - analysis/51_review_findings.yaml
      - investigations/20_handoff.json
    prompts:
      - critical_review
  read_sources:
    - "{{CARD_DIR}}/analysis"
    - "{{CARD_DIR}}/investigations/00_intake.md"
  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: analysis/50_critical_review.md
        validation_mode: blocking
      - path: analysis/51_review_findings.yaml
        validation_mode: blocking
      - path: investigations/20_handoff.json
        validation_mode: blocking
