config_version: 1

phase:
  id: intake
  name: Intake
  description: Define the analysis question and constraints; identify relevant repositories during discovery without requiring a single-target choice.
  skills: []
  prompt:
    active: 2
    path: templates/prompts/ai_pipeline_analysis/intake/prompt_v<active>.md
  outputs:
    create_directories:
      - investigations
      - analysis
    create_artifacts:
      - investigations/00_intake.md
      - investigations/20_handoff.json
    prompts:
      - intake
  read_sources:
    - "{{CARD_DIR}}/ingest"
    - "{{CARD_DIR}}/analysis/00_ingest_manifest.yaml"
    - "{{EAW_WORKDIR}}/config/repos.conf"
  completion:
    strategy: required_artifacts_exist
    required_artifacts:
      - path: investigations/00_intake.md
        validation_mode: blocking
      - path: investigations/20_handoff.json
        validation_mode: blocking
