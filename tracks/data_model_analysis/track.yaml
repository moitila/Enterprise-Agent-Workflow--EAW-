config_version: 1

track:
  id: data_model_analysis
  name: Data Model Analysis
  description: Produce a traceable conceptual and logical analysis of information objects, relationships, lifecycles, and integrity.
  initial_phase: source_inventory
  final_phase: analysis_package
  initial_outputs:
    create_directories:
      - analysis
      - investigations
  phases:
    - source_inventory
    - data_object_analysis
    - relationship_analysis
    - lifecycle_integrity_analysis
    - critical_review
    - analysis_package
  transitions:
    source_inventory:
      next: data_object_analysis
      contract: {emit_handoff: true, consume_previous: true}
    data_object_analysis:
      next: relationship_analysis
      contract: {emit_handoff: true, consume_previous: true}
    relationship_analysis:
      next: lifecycle_integrity_analysis
      contract: {emit_handoff: true, consume_previous: true}
    lifecycle_integrity_analysis:
      next: critical_review
      contract: {emit_handoff: true, consume_previous: true}
    critical_review:
      next: analysis_package
      contract: {emit_handoff: true, consume_previous: true}
  rules:
    one_prompt_per_phase: true
    generated_artifacts_of_each_phase_must_be_non_empty: true
